name: daejeon-apt-index

on:
  push:
    branches: [main]
  pull_request:
  # 매일 03:17 (한국 시각) = 18:17 UTC. 실거래는 최근 몇 달 치를 매일 다시 받아 새로 신고된 거래를 반영합니다.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      seoul_collect:
        description: "서울 실거래 이어 받기 (다 모이기 전, 배포 뒤에 실행)"
        type: boolean
        default: false
      slow_collect:
        description: "배포 뒤 공급면적·관리비·후기 이어 받기 (끄면 화면만 빨리 바꿈. 다른 실행이 수집 중일 때 겹치지 않게)"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m djdex demo
      - run: python -m djdex --config config.sejong.toml demo --out site-demo/sejong
      - run: python -m djdex --config config.seoul.toml demo --out site-demo/seoul

  publish:
    # 실제 데이터 수집과 배포는 예약 실행이나 수동 실행 때만
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/raw_presale
            data/geo.json
            data/poi.json
            data/school
          key: djdex-data-${{ github.run_id }}
          restore-keys: djdex-data-
      # 전월세·단지 정보(K-apt)는 따로 캐시합니다 (대전 캐시의 경로 목록을 바꾸면 캐시를 못 찾아 처음부터 다시 받기 때문).
      # 캐시 이름 끝의 2: 오래 도는 옛 실행이 나중에 끝나며 옛 자료로 덮어쓰지 않게 이름을 바꿨습니다 (옛 이름은 처음 한 번만 이어받음).
      - name: 전월세·단지 정보 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent2-${{ github.run_id }}
          restore-keys: |
            djdex-rent2-
            djdex-rent-
      # 건축물대장 공급면적도 따로 캐시합니다 (며칠에 걸쳐 이어 받음).
      - name: 공급면적 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/bldg
          key: djdex-bldg2-${{ github.run_id }}
          restore-keys: |
            djdex-bldg2-
            djdex-bldg-
      # 언덕(고저차)도 따로 캐시합니다 (공개 지형 타일로 새 단지만 계산). 세종·서울은 각 지역 캐시 안에 있습니다.
      - name: 언덕 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/elev.json
          key: djdex-elev-${{ github.run_id }}
          restore-keys: djdex-elev-
      # 서울 자료는 먼저 복원합니다. 실거래를 다 모았으면(data/seoul/READY) 대전·세종 지역 메뉴에 서울이 나오고
      # 아래에서 서울 사이트도 만듭니다.
      - name: 서울 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/seoul
          key: djdex-seoul-${{ github.run_id }}
          restore-keys: djdex-seoul-
      - name: 수집, 계산, 사이트 생성
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m djdex all
      # 뒤 단계가 실패해도 받아 둔 실거래·입지 데이터는 저장해서 다음 실행 때 다시 받지 않습니다.
      - name: 수집 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/raw_presale
            data/geo.json
            data/poi.json
            data/school
          key: djdex-data-${{ github.run_id }}
      - name: 전월세·단지 정보 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent2-${{ github.run_id }}
      - name: 공급면적 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bldg
          key: djdex-bldg2-${{ github.run_id }}
      - name: 언덕 캐시 저장
        if: ${{ always() && hashFiles('data/elev.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/elev.json
          key: djdex-elev-${{ github.run_id }}
      # 세종은 대전 사이트 안 /sejong/ 에 만듭니다. 세종이 실패해도 대전은 배포합니다.
      # 캐시는 대전과 따로 둡니다 (대전 캐시의 경로 목록을 바꾸면 캐시를 못 찾아 처음부터 다시 받기 때문).
      - name: 세종 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/sejong
          key: djdex-sejong2-${{ github.run_id }}
          restore-keys: |
            djdex-sejong2-
            djdex-sejong-
      - name: 세종 수집, 계산, 사이트 생성
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m djdex --config config.sejong.toml all --out site/sejong
      - name: 세종 수집 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sejong
          key: djdex-sejong2-${{ github.run_id }}
      # 서울: 실거래를 다 모은 뒤부터 /seoul/ 에 만듭니다. 실패해도 대전·세종은 배포합니다.
      # 서울은 단지가 많아 수집(최근 거래·전월세·단지 정보·입지)을 배포 뒤로 미루고, 여기서는 받아 둔 자료로 사이트만 만듭니다.
      # 학교알리미(중학교 순전입률)·물가는 호출이 적어 여기서 받습니다 (이미 받은 해는 건너뜀).
      - name: 서울 계산, 사이트 생성
        id: seoul_site
        if: ${{ hashFiles('data/seoul/READY') != '' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          before=$(ls data/seoul/school 2>/dev/null | wc -l)
          python -m djdex --config config.seoul.toml school
          # 학교 자료를 새로 받았으면 아래에서 서울 캐시를 저장해 다음 배포 때 다시 받지 않게
          if [ "$(ls data/seoul/school 2>/dev/null | wc -l)" != "$before" ]; then echo "fresh=true" >> "$GITHUB_OUTPUT"; fi
          python -m djdex --config config.seoul.toml build --out site/seoul
      # 배포본 화면 코드 압축: 설명 주석을 지우고 이름을 줄여 그대로 가져다 쓰기 어렵게 (저장소 원본은 그대로).
      # 압축에 실패하면 압축하지 않은 채로 배포합니다
      - name: 화면 코드 압축
        continue-on-error: true
        run: bash scripts/minify_site.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 카카오 로그인 저장소(Supabase 무료)는 7일 동안 아무 요청이 없으면 잠듭니다. 배포 때마다 한 번 깨워 둡니다.
      - name: 기록 보관함 깨우기
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/account_check.py --ping
      # 서울 이어 받기: 매일 예약 실행 때 (또는 수동 실행에서 고르면) 배포가 끝난 뒤 하루 호출 한도 안에서 받습니다.
      # 실거래를 다 모으기 전에는 매매와 그 단지의 입지(카카오)를, 다 모은 뒤에는 최근 거래 새로 받기·전월세·단지 정보·
      # 새 단지 입지·학교·물가를 받아 두고 다음 배포 때 화면에 냅니다. 실패해도 배포에는 영향이 없습니다.
      - name: 서울 이어 받기 (배포 뒤)
        id: seoul_collect
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.seoul_collect || (inputs.slow_collect && hashFiles('data/seoul/READY') != '')) }}
        continue-on-error: true
        timeout-minutes: 120
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          if [ -f data/seoul/READY ]; then
            python -m djdex --config config.seoul.toml all --out site-seoul-next
          else
            python -m djdex --config config.seoul.toml collect
            python -m djdex --config config.seoul.toml locate || echo "::warning::서울 입지 조사 실패, 다음 실행 때 이어서 합니다"
          fi
      # 오래 걸리는 수집(공급면적·관리비·카카오맵 장소·네이버 글)은 배포가 끝난 뒤에 합니다.
      # 하루 한도 안에서 며칠에 걸쳐 이어 받고, 받은 것은 캐시에 저장해 다음 배포부터 화면에 나옵니다. 실패해도 배포에는 영향이 없습니다.
      - name: 대전 공급면적·관리비·후기 이어 받기
        id: slow_dj
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.slow_collect) }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m djdex slow
      - name: 대전 이어 받은 단지 정보 저장
        if: ${{ always() && (steps.slow_dj.outcome == 'success' || steps.slow_dj.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent2-${{ github.run_id }}-slow
      - name: 대전 이어 받은 공급면적 저장
        if: ${{ always() && (steps.slow_dj.outcome == 'success' || steps.slow_dj.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: data/bldg
          key: djdex-bldg2-${{ github.run_id }}-slow
      - name: 세종 공급면적·관리비·후기 이어 받기
        id: slow_sj
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.slow_collect) }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m djdex --config config.sejong.toml slow
      - name: 세종 이어 받은 자료 저장
        if: ${{ always() && (steps.slow_sj.outcome == 'success' || steps.slow_sj.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: data/sejong
          key: djdex-sejong2-${{ github.run_id }}-slow
      # 서울 관리비·카카오맵 장소·네이버 글·공급면적: 단지가 많아 대전·세종을 먼저 받고 맨 뒤에서 하루 몫씩 이어 받습니다.
      - name: 서울 관리비·후기 이어 받기
        id: slow_se
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.slow_collect) && hashFiles('data/seoul/READY') != '' }}
        continue-on-error: true
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m djdex --config config.seoul.toml slow
      # 서울 자료를 받은 실행에서만 저장합니다 (배포 때마다 큰 캐시를 새로 쌓지 않게). 서울 관리비·후기까지 받은 뒤 한 번에
      - name: 서울 수집 캐시 저장
        if: ${{ always() && (steps.seoul_collect.outcome == 'success' || steps.seoul_collect.outcome == 'failure' || steps.slow_se.outcome == 'success' || steps.slow_se.outcome == 'failure' || steps.seoul_site.outputs.fresh == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: data/seoul
          key: djdex-seoul-${{ github.run_id }}
