name: daejeon-apt-index

on:
  push:
    branches: [main]
  pull_request:
  # 매일 03:17 (한국 시각) = 18:17 UTC. 실거래는 최근 몇 달 치를 매일 다시 받아 새로 신고된 거래를 반영합니다.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      seoul_collect:
        description: "서울 실거래 이어 받기 (다 모이기 전, 배포 뒤에 실행)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m djdex demo
      - run: python -m djdex --config config.sejong.toml demo --out site-demo/sejong
      - run: python -m djdex --config config.seoul.toml demo --out site-demo/seoul

  publish:
    # 실제 데이터 수집과 배포는 예약 실행이나 수동 실행 때만
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/raw_presale
            data/geo.json
            data/poi.json
            data/school
          key: djdex-data-${{ github.run_id }}
          restore-keys: djdex-data-
      # 전월세·단지 정보(K-apt)는 따로 캐시합니다 (대전 캐시의 경로 목록을 바꾸면 캐시를 못 찾아 처음부터 다시 받기 때문).
      - name: 전월세·단지 정보 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent-${{ github.run_id }}
          restore-keys: djdex-rent-
      # 건축물대장 공급면적도 따로 캐시합니다 (며칠에 걸쳐 이어 받음).
      - name: 공급면적 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/bldg
          key: djdex-bldg-${{ github.run_id }}
          restore-keys: djdex-bldg-
      # 서울 자료는 먼저 복원합니다. 실거래를 다 모았으면(data/seoul/READY) 대전·세종 지역 메뉴에 서울이 나오고
      # 아래에서 서울 사이트도 만듭니다.
      - name: 서울 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/seoul
          key: djdex-seoul-${{ github.run_id }}
          restore-keys: djdex-seoul-
      - name: 수집, 계산, 사이트 생성
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python -m djdex all
      # 뒤 단계가 실패해도 받아 둔 실거래·입지 데이터는 저장해서 다음 실행 때 다시 받지 않습니다.
      - name: 수집 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/raw_presale
            data/geo.json
            data/poi.json
            data/school
          key: djdex-data-${{ github.run_id }}
      - name: 전월세·단지 정보 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent-${{ github.run_id }}
      - name: 공급면적 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bldg
          key: djdex-bldg-${{ github.run_id }}
      # 세종은 대전 사이트 안 /sejong/ 에 만듭니다. 세종이 실패해도 대전은 배포합니다.
      # 캐시는 대전과 따로 둡니다 (대전 캐시의 경로 목록을 바꾸면 캐시를 못 찾아 처음부터 다시 받기 때문).
      - name: 세종 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/sejong
          key: djdex-sejong-${{ github.run_id }}
          restore-keys: djdex-sejong-
      - name: 세종 수집, 계산, 사이트 생성
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python -m djdex --config config.sejong.toml all --out site/sejong
      - name: 세종 수집 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sejong
          key: djdex-sejong-${{ github.run_id }}
      # 서울: 실거래를 다 모은 뒤부터 /seoul/ 에 만듭니다. 실패해도 대전·세종은 배포합니다.
      - name: 서울 수집, 계산, 사이트 생성
        id: seoul_site
        if: ${{ hashFiles('data/seoul/READY') != '' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python -m djdex --config config.seoul.toml all --out site/seoul
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 서울 실거래를 다 모으기 전: 매일 예약 실행 때 (또는 수동 실행에서 고르면) 배포가 끝난 뒤
      # 하루 호출 한도 안에서 이어 받고, 받은 단지의 입지(카카오)도 미리 조사해 둡니다. 실패해도 배포에는 영향이 없습니다.
      - name: 서울 실거래 이어 받기 (다 모이기 전)
        id: seoul_collect
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.seoul_collect) && hashFiles('data/seoul/READY') == '' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python -m djdex --config config.seoul.toml collect
          python -m djdex --config config.seoul.toml locate || echo "::warning::서울 입지 조사 실패, 다음 실행 때 이어서 합니다"
      # 서울 자료가 바뀐 실행에서만 저장합니다 (배포 때마다 큰 캐시를 새로 쌓지 않게)
      - name: 서울 수집 캐시 저장
        if: ${{ always() && (steps.seoul_collect.outcome == 'success' || steps.seoul_collect.outcome == 'failure' || steps.seoul_site.outcome == 'success' || steps.seoul_site.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: data/seoul
          key: djdex-seoul-${{ github.run_id }}
