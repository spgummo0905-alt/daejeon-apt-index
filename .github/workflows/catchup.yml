name: catchup

# 몰아받기: 대전·서울의 관리비·공급면적·단지 정보를 평소보다 오래 받아 둡니다.
# 같은 인증 키로 지역이 한도를 나눠 쓰므로 거의 끝난 대전을 먼저 마무리하고, 남은 한도를 서울에 씁니다.
# 공공데이터포털 운영계정 승인(2026-10-27) 뒤로 하루 한도가 넉넉해 호출 수 상한을 올렸습니다.
# 그래도 한도를 넘으면(429·LIMITED_NUMBER…) 그 단계만 그날은 멈추고 받은 데까지 저장합니다.
# 받은 것은 배포와 같은 캐시 이름으로 저장해 다음 배포(매일 새벽)부터 화면에 나옵니다.
# 배포와 같은 concurrency 이름이라, 이 실행이 도는 동안 시작된 배포는 끝날 때까지 기다립니다.
on:
  # 서울 공급면적을 다 받을 때까지(약 열흘) 매일 새벽 배포 뒤에 한 번. 다 받으면 이 두 줄을 지웁니다.
  # 배포와 같은 concurrency 이름이라 배포가 늦어져도 겹치지 않고 차례로 돕니다.
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      seoul_bldg_hours:
        description: "서울 공급면적에 쓸 최대 시간 (시간)"
        default: "3.3"
      seoul_bldg_calls:
        description: "서울 공급면적 호출 수 상한 (하루 한도 안에서)"
        default: "22000"
      seoul_fee_calls:
        description: "서울 관리비 호출 수 상한 (하루 한도 안에서)"
        default: "18000"

# 저장소는 읽기만 (받은 자료는 캐시에만 저장)
permissions:
  contents: read

# 배포(build.yml publish)와 같은 이름: 겹치면 뒤에 온 쪽이 기다림
concurrency:
  group: data-collect
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      PYTHONUNBUFFERED: "1"
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # 배포(build.yml)와 같은 경로·이름으로 가장 최근 캐시를 복원
      - name: 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/raw_presale
            data/geo.json
            data/poi.json
            data/school
          key: djdex-data-${{ github.run_id }}
          restore-keys: djdex-data-
      - name: 전월세·단지 정보 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent2-${{ github.run_id }}
          restore-keys: djdex-rent2-
      - name: 공급면적 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/bldg
          key: djdex-bldg2-${{ github.run_id }}
          restore-keys: djdex-bldg2-
      - name: 서울 수집 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/seoul
          key: djdex-seoul-${{ github.run_id }}
          restore-keys: djdex-seoul-
      - name: 대전 관리비·공급면적 마무리
        id: dj
        continue-on-error: true
        timeout-minutes: 35
        run: python -m djdex slow --only fee,bldg --fee-calls 4000 --fee-minutes 15 --bldg-calls 1500 --bldg-minutes 15
      - name: 대전 관리비 저장
        if: ${{ always() && (steps.dj.outcome == 'success' || steps.dj.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw_rent
            data/kapt
          key: djdex-rent2-${{ github.run_id }}-catchup
      - name: 대전 공급면적 저장
        if: ${{ always() && (steps.dj.outcome == 'success' || steps.dj.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: data/bldg
          key: djdex-bldg2-${{ github.run_id }}-catchup
      - name: 서울 관리비·공급면적 몰아받기
        id: se
        if: ${{ !cancelled() && hashFiles('data/seoul/READY') != '' }}
        continue-on-error: true
        timeout-minutes: 270
        env:
          FEE_CALLS: ${{ inputs.seoul_fee_calls || '18000' }}
          BLDG_CALLS: ${{ inputs.seoul_bldg_calls || '22000' }}
          BLDG_HOURS: ${{ inputs.seoul_bldg_hours || '3.3' }}
        run: |
          minutes=$(python3 -c 'import os; print(min(float(os.environ["BLDG_HOURS"]), 3.3) * 60)')
          python -m djdex --config config.seoul.toml slow --only fee,bldg \
            --fee-calls "$FEE_CALLS" --fee-minutes 60 --bldg-calls "$BLDG_CALLS" --bldg-minutes "$minutes"
      # 단지 정보(K-apt)는 포털 오류로 자주 멈춰서 맨 뒤에 (따로 된 한도)
      - name: 서울 단지 정보 이어 받기
        id: se_kapt
        if: ${{ !cancelled() && hashFiles('data/seoul/READY') != '' }}
        continue-on-error: true
        timeout-minutes: 30
        run: python -m djdex --config config.seoul.toml slow --only kapt --kapt-minutes 25
      - name: 서울 수집 캐시 저장
        if: ${{ always() && (steps.se.outcome == 'success' || steps.se.outcome == 'failure' || steps.se_kapt.outcome == 'success' || steps.se_kapt.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: data/seoul
          key: djdex-seoul-${{ github.run_id }}-catchup
