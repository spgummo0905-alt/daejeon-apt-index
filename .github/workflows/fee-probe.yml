name: fee-probe

# 관리비 API 점검 (수동 실행): 대전·세종·서울에서 단지 네 곳씩, 최근 석 달 × JSON/XML 로 인건비를 불러
# 무엇이 오는지(정상·값 없음·포털 오류) 한 줄씩 로그에 남깁니다. 키는 로그에 나오지 않습니다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: 관리비 API 점검
        env:
          PYTHONUNBUFFERED: "1"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python -m djdex feeprobe || true
          python -m djdex --config config.sejong.toml feeprobe || true
          python -m djdex --config config.seoul.toml feeprobe || true
