name: push-run

# 관심 단지 새 소식 알림만 따로 보내기 (수동 실행): 배포된 사이트의 단지 자료(complexes.json)를 받아
# scripts/push_send.py 를 돌립니다. 키·SQL 설정을 고친 뒤 전체 배포 없이 알림만 점검할 때 씁니다.
# Secrets: SUPABASE_URL, SUPABASE_SECRET_KEY
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: 단지 자료 받기
        run: |
          BASE=$(python -c "import tomllib;print(tomllib.load(open('config.toml','rb'))['site']['base_url'])")
          for d in "" sejong/ seoul/ cheongju/; do
            mkdir -p "site/$d"
            for f in complexes.json small.json; do curl -fsS "$BASE$d$f" -o "site/$d$f" || rm -f "site/$d$f"; done
          done
          ls site
      - name: 알림 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/push_send.py site
