plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 집감 네이티브 셸 시제품(실험용). 운영 앱(kr.jipgam.app, TWA)과 패키지·서명이 다르고 운영 앱을 대체하지 않는다.
// 서명은 debug 키(Android 기본 개발 키)만 쓴다. 운영 업로드 키는 쓰지 않는다.
android {
    namespace 'kr.jipgam.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.jipgam.shell.dev'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0-spike'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    def bom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation bom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
}
