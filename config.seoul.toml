# 서울 버전: config.toml 위에 서울에서 다른 부분만 덮어씁니다. 아직 공개 전이라 실거래만 모읍니다.
# 실행: python -m djdex --config config.seoul.toml collect
# 25개 구 × 2006년부터 약 250개월이라 처음에는 하루 호출 한도 안에서 며칠에 나눠 받습니다.
extends = "config.toml"
data = "data/seoul"

[region]
name = "서울"
geo_name = "서울특별시"   # 카카오 주소 검색용
example_dong = "잠실동"

# 국토부 실거래가 API의 LAWD_CD (법정동코드 앞 5자리)
[region.districts]
"11110" = "종로구"
"11140" = "중구"
"11170" = "용산구"
"11200" = "성동구"
"11215" = "광진구"
"11230" = "동대문구"
"11260" = "중랑구"
"11290" = "성북구"
"11305" = "강북구"
"11320" = "도봉구"
"11350" = "노원구"
"11380" = "은평구"
"11410" = "서대문구"
"11440" = "마포구"
"11470" = "양천구"
"11500" = "강서구"
"11530" = "구로구"
"11545" = "금천구"
