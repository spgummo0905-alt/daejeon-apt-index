"11680" = "강남구"
"11710" = "송파구"
"11740" = "강동구"

[site]
base_url = "https://spgummo0905-alt.github.io/daejeon-apt-index/seoul/"

[collect]
# 한 번 실행에 API(매매·분양권 각각)를 이 횟수만큼만 부르고, 나머지는 다음 실행 때 이어서 받습니다.
# 같은 키로 대전·세종도 매일 받으므로 하루 한도를 다 쓰지 않게 여유를 둡니다.
max_calls_per_run = 3000

[school]
sido = "11"
