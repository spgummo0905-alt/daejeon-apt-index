# 서울 버전: config.toml 위에 서울에서 다른 부분만 덮어씁니다.
# 실행: python -m djdex --config config.seoul.toml all --out site/seoul
# 25개 구 × 2006년부터 약 250개월이라 처음에는 하루 호출 한도 안에서 며칠에 나눠 받고,
# 다 모이면(data/seoul/READY) 사이트를 만들어 /seoul/ 에 올리고 지역 바꾸기 메뉴에도 나옵니다.
extends = "config.toml"
data = "data/seoul"

[region]
name = "서울"
geo_name = "서울특별시"   # 카카오 주소 검색용
example_dong = "잠실동"

# 국토부 실거래가 API의 LAWD_CD (법정동코드 앞 5자리)
[region.districts]
"11110" = "종로구"
"11140" = "중구"
"11170" = "용산구"
"11200" = "성동구"
"11215" = "광진구"
"11230" = "동대문구"
"11260" = "중랑구"
"11290" = "성북구"
"11305" = "강북구"
"11320" = "도봉구"
"11350" = "노원구"
"11380" = "은평구"
"11410" = "서대문구"
"11440" = "마포구"
"11470" = "양천구"
"11500" = "강서구"
"11530" = "구로구"
"11545" = "금천구"
"11560" = "영등포구"
"11590" = "동작구"
"11620" = "관악구"
"11650" = "서초구"
"11680" = "강남구"
"11710" = "송파구"
"11740" = "강동구"

[site]
base_url = "https://www.jipgam.kr/seoul/"
# 링크 미리보기(카카오톡 등) 이미지. scripts/og 에서 지역마다 만듭니다.
og_image = "static/og/seoul.jpg"

[collect]
# 한 번 실행에 API(매매·분양권 각각)를 이 횟수만큼만 부르고, 나머지는 다음 실행 때 이어서 받습니다.
# 같은 키로 대전·세종도 매일 받으므로 하루 한도를 다 쓰지 않게 여유를 둡니다.
max_calls_per_run = 4000

[location.hub]
# 서울 학원가는 수학 학원이 몰린 곳을 자동으로 찾습니다 (대치·목동·중계 같은 곳).
# 지하철로 걸리는 시간 계산은 대전 1호선용이라, 서울은 학원가까지 걸어서 걸리는 시간으로 봅니다.
auto = true
hubs = []
detect = { merge_m = 1500, top = 0.08, max_hubs = 6 }

[school]
sido = "11"

[finder]
# 직장 위치 (직선거리 계산용, 대략적인 좌표)
workplaces = [
  { name = "강남역", lat = 37.4979, lng = 127.0276 },
  { name = "시청·광화문", lat = 37.5663, lng = 126.9779 },
  { name = "여의도", lat = 37.5216, lng = 126.9242 },
  { name = "삼성역", lat = 37.5088, lng = 127.0631 },
  { name = "판교역", lat = 37.3947, lng = 127.1112 },
  { name = "구로디지털단지", lat = 37.4852, lng = 126.9015 },
  { name = "마곡", lat = 37.5602, lng = 126.8255 },
]
# 서울은 전역 규제지역이라 대출 규칙이 다릅니다 (2025년 10월 대책 기준 어림값, 바뀌면 여기만 고치세요).
ltv = 0.40
ltv_by = { first = 0.70, none = 0.40, switch = 0.40, multi = 0.0 }
# 집값 구간별 주택담보대출 최대 한도 [[집값 상한, 최대 대출], ...] (만원, 집값 오름차순)
loan_caps = [[150000, 60000], [250000, 40000], [99999999, 20000]]
