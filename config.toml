# 집감 설정 파일 (대전 기본, 다른 지역은 config.<지역>.toml)
# 숫자를 바꾸면 다음 `python -m djdex score` 실행부터 반영됩니다.

[region]
name = "대전"
# 국토부 실거래가 API의 LAWD_CD (법정동코드 앞 5자리)
districts = { "30110" = "동구", "30140" = "중구", "30170" = "서구", "30200" = "유성구", "30230" = "대덕구" }

[site]
# 배포 주소. 링크 미리보기(카카오톡 등)와 사이트맵은 절대 주소가 필요합니다.
# 내 도메인을 연결하면 이 값을 그 주소로 바꾸세요. 끝에 / 를 붙입니다.
base_url = "https://www.jipgam.kr/"
# 링크 미리보기(카카오톡 등) 이미지. scripts/og 에서 지역마다 만듭니다.
og_image = "static/og/daejeon.jpg"
# 검색 등록 확인 코드: 네이버 서치어드바이저 / 구글 서치 콘솔에서 'HTML 태그' 방식으로 받은
# content="..." 안의 값만 넣으세요. 비워 두면 태그를 넣지 않습니다.
naver_site_verification = ""
google_site_verification = ""
# 위쪽 지역 고르기 (각 지역 사이트 주소). 세종은 config.sejong.toml 로 /sejong/ 에 만듭니다.
# group 은 고르기 창에서 묶는 권역(적힌 순서대로), desc 는 이름 아래 한 줄, badge 는 이름 옆 작은 표시.
# ready 가 있으면 그 파일이 있을 때만 보여줍니다 (서울은 실거래를 다 모은 뒤 공개).
# 지역이 늘어도 위쪽에는 버튼 하나만 두고, 7곳이 넘으면 고르기 창에 검색칸이 생깁니다.
regions = [
  { name = "서울", group = "수도권", desc = "25개 구", badge = "NEW", url = "https://www.jipgam.kr/seoul/", ready = "data/seoul/READY" },
  { name = "대전", group = "충청권", desc = "5개 구", url = "https://www.jipgam.kr/" },
  { name = "세종", group = "충청권", desc = "세종시 전역", url = "https://www.jipgam.kr/sejong/" },
  { name = "청주", group = "충청권", desc = "4개 구", badge = "NEW", url = "https://www.jipgam.kr/cheongju/", ready = "data/cheongju/READY" },
]

[app]
# 안드로이드 앱(android/ 폴더, TWA). 앱 소유 확인 파일(/.well-known/assetlinks.json)에 들어갈 서명 인증서 지문(SHA-256).
# 비어 있으면 파일을 만들지 않아요. Play Console → 앱 무결성(앱 서명)의 'SHA-256 인증서 지문'을 적습니다 (여러 개 가능).
android_package = "kr.jipgam.app"
android_sha256 = []

[account]
# 카카오 로그인으로 기록 이어 보기 (Supabase). 저장소 주소와 공개용 키는 GitHub Secrets 의
# SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY 에 넣고, 표·함수는 scripts/supabase_setup.sql 로 만듭니다.
# 아래는 개인정보처리방침(privacy.html)에 적는 값. 책임자와 연락처가 비어 있으면 로그인을 넣지 않습니다.
# Supabase 의 로그인 연결 이름. 기본 카카오 연결은 이메일을 꼭 요청해(비즈 앱만 가능) 쓰지 않고,
# '맞춤 연결(Custom OIDC)'로 카카오를 닉네임·프로필 사진만 요청하게 만들어 씁니다.
provider = "custom:kakao"
owner = "집감 운영자"   # 개인정보 보호책임자 (이름 또는 운영자명)
email = "t0mango@gmail.com"   # 문의·열람·삭제 요청을 받을 이메일
storage = "일본(도쿄)"  # Supabase 서버 위치 (프로젝트를 만들 때 고른 곳)
since = "2026-10-26"   # 처리방침 시행일

[collect]
# 국토부 아파트 매매 실거래가는 2006년 1월부터 공개됩니다.
start_ym = "200601"
# 신고 기한(30일)과 계약 해제 반영 때문에 최근 몇 개월은 매번 다시 받습니다.
refresh_recent_months = 3
# 상세 자료 API: 기본 API 항목에 단지 일련번호(aptSeq) 등이 더해집니다.
endpoint = "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev"
rows_per_page = 1000
# 분양권·입주권 전매 거래. 입주 전후 신축 단지는 거래 대부분이 여기에만 잡힙니다.
# 공공데이터포털에서 '국토교통부_아파트 분양권전매 신고 자료'를 따로 활용신청해야 합니다.
# 승인 전이면 경고만 남기고 매매 거래로만 진행합니다.
collect_presale = true
presale_endpoint = "https://apis.data.go.kr/1613000/RTMSDataSvcSilvTrade/getRTMSDataSvcSilvTrade"
# 전월세 실거래 (단지 페이지 '전세·갭' 보기). '국토교통부_아파트 전월세 실거래가 자료' 활용신청이 필요하고 2011년부터 공개됩니다.
# 승인 전이면 경고만 남기고 넘어갑니다.
collect_rent = true
rent_endpoint = "https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent"
rent_start_ym = "201101"
# 공동주택관리정보(K-apt) 세대수·동수·주차 (같은 인증키, 활용신청 필요)
collect_kapt = true
# 건축물대장 전유공용면적으로 평형별 공급면적 ('97㎡(전용 77)'). '국토교통부_건축HUB_건축물대장정보 서비스' 활용신청 필요.
# 하루 1만 번 한도를 대전·세종이 나눠 쓰고, 다 받을 때까지 며칠에 걸쳐 이어 받습니다.
collect_bldg = true
bldg_calls_per_run = 4500
# 관리비(공용관리비, 최근 공개 달). '국토교통부_공동주택관리비(공용관리비)정보제공서비스'(V3) 활용신청 필요.
# 단지마다 17번 불러야 해서 하루 5천 번 한도 안에서 며칠에 걸쳐 받습니다.
collect_fee = true
fee_calls_per_run = 2400

[filters]
# 해제(취소)된 거래 제외
exclude_cancelled = true
# 직거래 제외: 가족 간 증여성 저가 거래가 섞여 시세를 왜곡하기 쉽습니다.
exclude_direct = true

[metrics]
# 대표 가격은 ㎡당 중위가격 × 이 면적(전용 84㎡ 환산)으로 보여줍니다.
reference_area = 84.0
# 가격 비교에 쓰는 구간 길이(개월). 끝 시점과 n년 전 시점에 각각 적용됩니다.
window_months = 12
# 구간 안 거래가 이보다 적으면 그 구간 가격은 계산하지 않습니다.
min_trades = 2
# 연평균 수익률(CAGR)을 계산할 기간(년)
cagr_years = [10, 5]
# 대표 가격은 이 순서로 짧은 구간부터 보고, 거래가 min_trades 이상인 첫 구간을 씁니다.
# 오르는 장에서 12개월 중위가가 시세를 늦게 따라가는 문제를 줄입니다.
price_windows = [3, 6, 12]
# 어느 해에도 거래가 이 건수에 못 미친 단지는 '소규모'(나홀로·빌라형)로 보고
# 순위, TOP, 지도에서 기본으로 뺍니다. 페이지는 그대로 만듭니다.
small_peak_trades = 8
# 거래 면적 중간값이 이보다 작은 단지(전용 ㎡)는 '원룸형'으로 보고 소규모와 같이 기본 목록에서 뺍니다.
# 원룸·투룸 위주 단지는 84㎡ 환산가가 가족형 아파트 시세와 비교되지 않기 때문입니다.
min_main_area = 45
# 한 동짜리 단지 중 최고층이 이 층 이하이면 '나홀로'(빌라형)로 보고 소규모와 같이 기본 목록에서 뺍니다.
# 2026.10 로그: 탄방·둔산·갈마·지족의 2003~2007년 '○○빌' 단지들이 한 동, 10~15층이었습니다.
# 한 동이라도 이보다 높은 주상복합 타워는 아파트로 둡니다.
lone_max_floor = 15
# 마지막 거래가 같은 면적대 이전 최고가보다 높고, 이 기간 안이면 '신고가'로 표시합니다.
new_high_days = 90

[finder]
# 조건으로 찾기의 직장 위치 (직선거리 계산용, 대략적인 좌표)
workplaces = [
  { name = "둔산·정부대전청사", lat = 36.3605, lng = 127.3836 },
  { name = "대덕연구단지(KAIST)", lat = 36.3721, lng = 127.3604 },
  { name = "대전역·원도심", lat = 36.3324, lng = 127.4346 },
  { name = "유성온천역", lat = 36.3537, lng = 127.3417 },
  { name = "정부세종청사", lat = 36.5040, lng = 127.2649 },
]
# 감당 가능 금액 계산 기본값 (대전은 비규제지역 기준 LTV 70%)
ltv = 0.70
# 설문으로 찾기의 상황별 LTV (비규제지역 일반 기준 어림값). 정책이 바뀌면 여기만 고치면 됩니다.
ltv_by = { first = 0.80, none = 0.70, switch = 0.70, multi = 0.60 }
dsr = 0.40
default_rate = 4.0
default_years = 30

[index]
# 종합 지수 = 아래 항목 중 값이 있는 것들의 평균. 신축은 입지점수만 남습니다.
components = ["location_score", "cagr_10y_pct", "cagr_5y_pct"]

[location]
# 카카오 로컬 API 카테고리 코드: SW8 지하철역, SC4 학교, AC5 학원, MT1 대형마트, HP8 병원
# kind = "nearest" 는 가장 가까운 곳까지 거리(m, 가까울수록 좋음),
# kind = "count" 는 반경 안 개수(많을수록 좋음),
# kind = "score" 는 카카오 조회 없이 계산한 0~100 점수를 그대로 씁니다 (아래 [location.hub]).
# kind = "value" 는 카카오 밖에서 구한 값(학군, 아래 [school])을 높을수록 좋은 백분위로 바꿉니다.
# nearest·count 항목은 대전 전체 단지 중 백분위로 바꾼 뒤 weight 로 가중평균합니다.
# keep_name = true 이면 가장 가까운 시설 이름도 저장합니다 (지하철역: 역별 단지 순위, 학원가 지하철 시간에 사용).
factors = [
  { key = "subway",     label = "지하철역까지 거리",   short = "지하철역", category = "SW8", kind = "nearest", radius = 3000, weight = 0.25, keep_name = true },
  { key = "hub",        label = "주요 학원가 접근성", short = "학원가", kind = "score", weight = 0.25 },
  { key = "school_mid", label = "주변 중학교 순전입률", short = "중학교 전입", kind = "value", weight = 0.10, note = "주변 중학교의 (전입 − 전출) ÷ 학생 수, 최근 3년 평균. 학군을 보고 이사 오는 집이 많을수록 높습니다" },
  { key = "elementary", label = "초등학교까지 거리",   short = "초등학교", category = "SC4", kind = "nearest", radius = 2000, weight = 0.10, name_contains = "초등학교" },
  { key = "academy_math", label = "반경 1km 수학 학원 수", short = "수학 학원", category = "AC5", kind = "count", radius = 1000, weight = 0.10, query = "수학", note = "입시 학원가를 가려내려고 이름이나 분류에 '수학'이 들어간 학원만 셉니다" },
  { key = "mart",       label = "대형마트까지 거리",   short = "대형마트", category = "MT1", kind = "nearest", radius = 5000, weight = 0.10 },
  { key = "hospital",   label = "반경 1km 병원 수",    short = "병원", category = "HP8", kind = "count",   radius = 1000, weight = 0.10 },
]

# 화면에서 입지 항목을 묶어 보여주는 단위. 점수는 위 weight 그대로라 묶어도 입지점수는 같습니다.
# 묶음 점수는 그 묶음 항목들의 가중평균(0~100)입니다. 학군 = 학교(중학교 순전입) + 학원가 + 주변 수학 학원.
groups = [
  { key = "transit", label = "교통", factors = ["subway"] },
  { key = "edu",     label = "학군", factors = ["school_mid", "hub", "academy_math"] },
  { key = "life",    label = "생활", factors = ["elementary", "mart", "hospital"] },
]

# 점수에는 넣지 않고 함께 조사만 하는 항목. query 가 있으면 카카오 키워드 검색으로 그 단어가 들어간 곳만 셉니다.
# 전체 학원 수에는 공무원·성인·예체능 학원이 섞여 원도심이 학원가로 잡혀서, 점수에는 수학 학원 수를 씁니다.
# (2026.10 빌드 로그: 전체 기준 자동 탐지는 둔산·선화동·관저동, 수학 기준은 둔산·관저동·지족동)
extras = [
  { key = "academy", label = "반경 1km 학원 수(전체)", category = "AC5", kind = "count", radius = 1000 },
]

# 주요 학원가 접근성: 학원 '개수'만으로는 동네 상가 학원과 대형 학원가가 구분되지 않아
# 대전의 대표 학원가까지 걸어서 또는 1호선으로 몇 분인지를 따로 봅니다.
# 시간 = min(도보, 가까운 역까지 도보 + 대기 + 역 수 × 역간 시간 + 내려서 걷는 시간)
# 학원가 점수 = weight × (full_min 분 안 100점 → zero_min 분 0점), 여러 학원가 중 가장 높은 점수.
# 좌표는 학원가 중심의 대략적인 위치입니다. stations 는 학원가에서 가까운 1호선 역과 내려서 걷는 시간(분).
# 둔산은 학원 밀집도 자동 탐지 결과(시청 남쪽, 36.348·127.385)에 맞춰 시청 부근으로 잡았습니다.
[location.hub]
walk_m_per_min = 80     # 걷는 속도
detour = 1.3            # 직선거리 대비 실제 걷는 거리
subway_wait_min = 5     # 대기·승하차
min_per_stop = 2        # 역 하나 지나는 시간
full_min = 10
zero_min = 40
hubs = [
  { name = "둔산 학원가",      weight = 1.00, lat = 36.3495, lng = 127.3835, stations = { "시청" = 4, "탄방" = 10 } },
  { name = "노은·지족 학원가", weight = 0.85, lat = 36.3790, lng = 127.3190, stations = { "노은" = 6, "지족" = 6 } },
  { name = "도안 학원가",      weight = 0.75, lat = 36.3440, lng = 127.3390 },
]

[school]
# 학교알리미 공시정보 OpenAPI (환경변수 SCHOOLINFO_KEY). 시도코드 30 = 대전.
# API 종류: 0 = 학교기본정보(위도·경도), 10 = 전·출입 및 학업중단 학생 수.
sido = "30"
api_basic = "0"
api_moves = "10"
years = 3          # 최근 몇 해의 전·출입을 평균할지
radius = 1500      # 단지에서 이 거리(m) 안 중학교를 봅니다. 없으면 가장 가까운 한 곳.
max_schools = 3    # 가까운 순으로 최대 몇 곳까지 가중평균할지
min_students = 300 # 학생 수가 이보다 적은 학교는 몇 명의 이동에 크게 흔들려 뺍니다 (특수 목적 학교도 뺌)
cap = 10           # 순전입률을 ±이 값(%) 안으로 자릅니다. 최근 n년 자료가 다 없는 새 학교는 뺍니다.

