const DATA=[{id:'a',name:'한가람',where:'대전 서구',year:'1991년',hh:'1,380세대',grade:'A',score:78,price:'5.1억',access:'좋음',life:'우수',school:'보통',sun:'동지 약 2시간',visited:false}, {id:'b',name:'크로바',where:'대전 서구',year:'1992년',hh:'1,632세대',grade:'S',score:86,price:'6.2억',access:'우수',life:'좋음',school:'우수',sun:'동지 약 3시간',visited:true}, {id:'c',name:'목련',where:'대전 서구',year:'1993년',hh:'1,160세대',grade:'B',score:73,price:'4.8억',access:'보통',life:'좋음',school:'좋음',sun:'동지 약 1시간',visited:false}];
let screen=new URLSearchParams(location.search).get('screen')||'home', selected=DATA[0],saved=new Set(['a','b']),compare=new Set(['a','b']),visit=new Set(['a','b']),cardBack=false,modal='',filter='all',checked=new Set();

const list=(d)=>`<button class="panel listcard" data-go="detail" data-id="${d.id}">${art('list-art')}<div class="list-info"><div class="meta">${d.where} · ${d.year}</div><h3>${d.name} ${grade(d)}</h3><div class="meta">집감 지수 ${d.score}점 · ${d.hh}</div><strong>${d.price}</strong> <span class="meta">84㎡ 추정</span></div><span class="arrow">›</span></button>`;
function renderTop(){const home=screen==='home',back=['detail','album'].includes(screen);$('top').innerHTML=`${back?'<button class="back" data-go="'+(screen==='album'?'my':'home')+'">‹</button>':''}${home?'<div class="logo"><span class="logo-mark">⌂</span>집감</div>':'<div class="page-title">'+({finder:'조건으로 찾기',map:'지도에서 찾기',detail:'단지 한 장',compare:'단지 비교',visit:'임장 코스',my:'나의 집감',album:'내 카드첩'}[screen]||'집감')+'</div>'}<div class="top-right"><span class="demo">시안 · 예시 데이터</span><span class="avatar">J</span></div>`}
function nav(){const t=[['home','⌂','홈'],['finder','⌕','찾기'],['compare','⚖','비교'],['visit','⌁','임장'],['my','♙','MY']];const cur=screen==='map'?'finder':screen==='album'?'my':screen==='detail'?'finder':screen;$('nav').innerHTML=t.map(x=>`<button class="${x[0]===cur?'on':''}" data-go="${x[0]}"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join('')}
function home(){return `<div class="kicker">집을 고르는 새로운 기준</div><h1 class="hero-title">좋은 집은,<br>한 장으로도 알 수 있어요.</h1><div class="sub" style="margin-bottom:18px">둘러본 집부터 임장 기록까지. 한 장에 담아보세요.</div><button class="searchbox" style="width:100%;text-align:left" data-go="finder"><span class="search-icon">⌕</span>아파트 이름, 지역, 조건으로 찾기</button><div class="title-row"><strong class="section-title">이어서 볼 집</strong><button class="more" data-go="my">내 후보 모두 보기 ›</button></div><button class="panel feature home-card" style="width:100%" data-go="detail" data-id="a">${art()}<div><div class="badgeblue">최근 살펴본 단지</div><h3>한가람</h3><div class="small">집감 지수 78점 · A등급<br>대전 서구 · 1991년 준공</div><div class="value">5.1억 <span style="font-size:10px;color:#9aa8bc;font-weight:700">84㎡ 추정</span></div></div></button><div class="title-row"><strong class="section-title">오늘 발견할 집 카드</strong><button class="more" data-go="album">카드첩 열기 ›</button></div><div class="colcards">${DATA.map(mini).join('')}</div><button class="panel" style="width:100%;padding:14px 17px;text-align:left;display:flex;align-items:center;justify-content:space-between;margin-top:13px;border:0" data-go="album"><div><strong style="font-size:13px">✦ 내 카드 12장 모아보기</strong><div class="sub">관심 집을 모아서 나만의 집감 카드첩 완성</div></div><span style="color:#8b9bb1">›</span></button>`}
function finder(){const items=filter==='cheap'?DATA.filter(x=>x.id!=='b'):filter==='best'?DATA.filter(x=>x.score>=78):DATA;return `<div class="kicker">STEP 01 · 후보 찾기</div><h1 class="hero-title">내게 맞는 집,<br>쉽게 좁혀보세요.</h1><div class="sub">조건을 고르면 아파트 카드로 바로 보여드려요.</div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">전체 보기</button><button class="filter ${filter==='cheap'?'active':''}" data-filter="cheap">6억 이하</button><button class="filter ${filter==='best'?'active':''}" data-filter="best">지수 78점 이상</button><button class="filter" data-go="map">⌖ 지도에서 찾기</button></div><div class="resultline"><div><div class="smlabel">조건에 맞는 카드</div><strong>${items.length}개 단지</strong></div><span>예시 결과 · 실데이터 아님</span></div><div style="display:grid;gap:11px">${items.map(list).join('')}</div><button class="primary" style="width:100%;margin-top:15px" data-go="map">지도에서 위치 함께 보기 →</button>`}
function map(){return `<div class="kicker">STEP 01 · 지도에서 찾기</div><h1 class="hero-title" style="margin-bottom:14px">가격을 보고,<br>카드로 비교하세요.</h1><div class="mapcanvas"><div class="maptop"><div class="mapsearch">⌕ 단지·동네 검색</div><div class="mapsearch">84㎡ 가격 ▼</div></div><span class="map-label" style="left:8%;top:24%">둔산동</span><span class="map-label" style="right:9%;top:39%">갈마동</span><button class="mappin grey" style="top:23%;left:33%" data-map="b">6.2억</button><button class="mappin" style="top:41%;left:43%" data-map="a">5.1억</button><button class="mappin grey" style="top:56%;left:17%" data-map="c">4.8억</button><div class="mapfloat"><div class="panel">${art('list-art')}<div style="margin-left:92px;margin-top:-74px;min-height:80px"><div class="smlabel">선택된 단지 · 예시 지도</div><strong id="mapSelected">${selected.name}</strong><div class="smlabel" style="margin-top:3px">집감 지수 ${selected.score}점 · ${selected.grade}등급</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><strong id="mapPrice">${selected.price}</strong><button style="background:#eaf2ff;color:#2468ef;border:0;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:900" data-go="detail" id="mapDetail">카드 보기 →</button></div></div></div></div></div><p class="sub">※ 이 지도는 UI 배치만 보여 주는 가상 지도입니다. 실제 구현에는 기존 카카오 지도와 좌표를 사용합니다.</p>`}
function detail(){const d=selected;return `<div class="kicker">STEP 02 · 이 집 이해하기</div><div class="detail-card" style="margin-top:12px"><div class="row between"><span class="mini-k">HOUSE CARD / ${d.where}</span>${grade(d)}</div><h2 class="name">${d.name}</h2><div class="meta">${d.year} · ${d.hh} · 84㎡ 기준</div>${art('detail-art')}<div class="row between" style="margin-top:17px;align-items:end"><div><div class="smlabel">84㎡ 기준 추정 시세</div><div class="big-price">${d.price}</div></div><div style="text-align:right"><div class="smlabel">집감 종합 지수</div><div style="font-size:25px;font-weight:900;color:#2468ec">${d.score}<span style="font-size:12px">점</span></div></div></div><div class="divider"></div><div class="detail-grid"><div><small>교통</small><b>${d.access}</b></div><div><small>생활</small><b>${d.life}</b></div><div><small>학군</small><b>${d.school}</b></div></div></div><div class="subnav"><button class="on">핵심 요약</button><button data-toast="가격 및 실거래 상세 연결 대상">가격·실거래</button><button data-toast="일조 미리보기 연결 대상">일조</button><button data-toast="입지 상세 연결 대상">입지</button></div><div class="accent-note">⌁ 카드 앞면은 정보를 요약하고, 뒷면에는 직접 확인할 항목과 방문 기록이 담깁니다.</div><div class="actionrow"><button class="outline" data-save="${d.id}">${saved.has(d.id)?'♥ 관심 저장됨':'♡ 관심 저장'}</button><button class="outline" data-flip="${d.id}">↻ 카드 뒤집기</button></div><div class="actionrow"><button class="primary" data-compare="${d.id}">비교 카드에 담기</button><button class="primary" data-visit="${d.id}">임장 코스에 담기</button></div>`}
function compareScreen(){const a=D('a'),b=D('b');return `<div class="kicker">STEP 03 · 함께 비교하기</div><h1 class="hero-title">두 장을 나란히,<br>차이가 바로 보이도록.</h1><div class="sub">같은 기준으로 비교하고 다음 행동까지 연결해요.</div><div class="compare-pair" style="margin-top:17px">${[a,b].map(d=>`<button class="compare-small home-card" data-go="detail" data-id="${d.id}">${art()}<h3>${d.name} ${grade(d)}</h3><div class="smlabel">84㎡ 기준 추정</div><strong>${d.price}</strong><div class="smlabel">집감 ${d.score}점</div></button>`).join('')}</div><div class="vsbox">비교 결과 · 크로바 지수 +8점 / 추정 시세 +1.1억</div><div class="matrix"><div class="matrixline"><span>항목</span><b>${a.name}</b><b>${b.name}</b></div><div class="matrixline"><span>집감 지수</span><b>${a.score}점</b><b class="better">${b.score}점</b></div><div class="matrixline"><span>84㎡ 추정</span><b class="better">${a.price}</b><b>${b.price}</b></div><div class="matrixline"><span>교통</span><b>${a.access}</b><b class="better">${b.access}</b></div><div class="matrixline"><span>학군</span><b>${a.school}</b><b class="better">${b.school}</b></div></div><button class="primary" style="width:100%;margin-top:14px" data-go="visit">이 카드들로 임장 코스 만들기 →</button><p class="sub" style="margin-top:10px">※ 차이는 예시 데이터 계산이며 실제 단지 평가가 아닙니다.</p>`}
function visitScreen(){return `<div class="kicker">STEP 04 · 직접 확인하기</div><h1 class="hero-title">이제 직접 가볼 차례,<br>카드를 순서대로.</h1><div class="route-top"><span class="whiteSub">나의 주말 임장 코스 · 예시</span><h2>둔산동 아파트 2곳</h2><div class="whiteSub">카드 선택 → 방문 → 체크 → 기록까지</div></div><div class="title-row"><strong class="section-title">방문 순서</strong><button class="more" data-toast="실제 구현에서는 프로젝트 일정과 연동">코스 편집 ›</button></div>${[D('a'),D('b')].map((d,i)=>`<div class="routeitem"><div class="order">${i+1}</div>${art()}<div class="desc"><strong>${d.name}</strong><small>${d.price} · ${d.grade}등급 · ${d.score}점</small></div><button data-check="${d.id}">현장 체크</button></div>`).join('')}<div class="panel checks"><strong style="font-size:15px">임장 현장 체크</strong><div class="sub">단지 카드를 방문하면서 확인한 내용을 기록합니다.</div>${['단지 주변 소음 확인','주차장 진입과 동선','동·층별 실제 채광','엘리베이터와 공용부','중개사에게 실제 호가 확인'].map((v,i)=>`<label><input type="checkbox" data-box="${i}" ${checked.has(i)?'checked':''}>${v}</label>`).join('')}</div>`}
function myScreen(){return `<div class="my-hero"><div class="whiteSub">MY JIPGAM</div><h2>나의 집, 나의 기록.</h2><p>살펴본 카드가 쌓일수록 비교 기준도 명확해져요.</p></div><div class="mystats"><div><strong>${saved.size}</strong><small>관심 카드</small></div><div><strong>1</strong><small>임장 프로젝트</small></div><div><strong>2</strong><small>방문 기록</small></div></div><button class="album-banner" style="width:100%;border:0;text-align:left" data-go="album"><div class="mini-deck"><span></span><span></span></div><div><strong>나의 아파트 카드첩</strong><small>발견한 카드 12장 · 등급별로 모아보기</small></div><span style="margin-left:auto;color:#93a3b8">›</span></button><div class="title-row"><strong class="section-title">내가 찜한 카드</strong><button class="more" data-go="album">전체 보기 ›</button></div><div class="colcards">${DATA.filter(d=>saved.has(d.id)).map(mini).join('')}</div><div class="title-row"><strong class="section-title">이어할 일</strong></div><div class="panel panel-pad"><div style="font-size:13px;font-weight:900">한가람 임장 카드 마저 채우기</div><div class="sub" style="margin:7px 0 13px">현장 체크 2/5 · 나중에 가족과 비교할 수 있어요.</div><button class="outline" style="width:100%" data-go="visit">임장 기록 이어가기 →</button></div>`}
function albumScreen(){return `<div class="album-head"><div class="smlabel">MY APARTMENT COLLECTION</div><h2>모은 카드가<br>나의 기준이 됩니다.</h2><div class="smlabel">직접 본 단지와 방문 기록을 카드에 모아요.</div><div class="progress"><i></i></div><div style="display:flex;justify-content:space-between;margin-top:7px"><small style="color:#c5d6ed">모은 카드 12장</small><small style="color:#c5d6ed">시안 · 수치 예시</small></div></div><div class="title-row"><strong class="section-title">아파트 컬렉션</strong><button class="more" data-toast="등급별 필터는 실제 구현 시 기존 카드첩 기능 재사용">S · A · B 전체</button></div><div class="album-grid">${[...DATA,...DATA.map(x=>Object.assign({},x,{name:x.name+' II'}))].map(mini).join('')}</div><div class="accent-note" style="margin-top:14px">컬렉션에서는 카드의 수집 재미를 강조하지만, 검색·상세·비교 화면에서는 절제된 업무용 카드를 사용합니다.</div>`}
function render(){renderTop();nav();const main=$('main');main.innerHTML=({home, finder, map, detail,compare:compareScreen,visit:visitScreen,my:myScreen,album:albumScreen}[screen]||home)();document.documentElement.setAttribute('data-screen',screen);history.replaceState(null,'',location.pathname+'?screen='+screen);window.scrollTo(0,0);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function openSheet(type,id){const d=D(id||selected.id);modal=type;const body=type==='flip'?`<div class="mini-k">CARD BACK / VISIT CHECK</div><h2>${d.name} 카드 뒷면</h2><p>현장에서 직접 확인할 사항입니다. 내용은 사용자 기록에 연결됩니다.</p><div class="flipface"><strong style="font-size:15px">현장에서 볼 것</strong><div class="checks" style="margin-top:7px">${['일조 및 창 방향','주차·엘리베이터 동선','도로 및 생활 소음','중개사 확인 사항'].map((v,i)=>`<label><input type="checkbox" data-box="${i}">${v}</label>`).join('')}</div></div><button class="primary" style="width:100%" data-go="visit">임장 카드 기록으로 이동 →</button>`:type==='card'?`<div class="mini-k">HOUSE CARD / SAMPLE DATA</div><h2>${d.name}</h2>${art()}<div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:24px">${d.price}</strong><span class="grade">${d.grade} · ${d.score}점</span></div><p>${d.where} · 84㎡ 추정 · 시안용 예시 수치입니다.</p><button class="primary" style="width:100%" data-go="detail" data-id="${d.id}">단지 카드 자세히 보기 →</button>`:`<h2>카드 정보</h2><p>실제 데이터 기반으로 바텀시트를 연결합니다.</p>`;
$('overlay').innerHTML=`<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="카드 상세"><div class="handle"></div><button class="closebtn" data-close>×</button>${body}</div></div>`}
function close(){modal='';$('overlay').innerHTML=''}
document.addEventListener('click',e=>{const node=e.target.closest('button,[data-card]');if(!node)return;if(node.hasAttribute('data-go')){const go=node.dataset.go;if(node.dataset.id)selected=D(node.dataset.id);screen=go;close();render()} else if(node.hasAttribute('data-card'))openSheet('card',node.dataset.card);else if(node.hasAttribute('data-map')){selected=D(node.dataset.map);render();}else if(node.hasAttribute('data-filter')){filter=node.dataset.filter;render()}else if(node.hasAttribute('data-save')){const id=node.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);toast(saved.has(id)?'관심 카드에 저장했습니다':'관심 카드 저장을 해제했습니다');render()}else if(node.hasAttribute('data-flip'))openSheet('flip',node.dataset.flip);else if(node.hasAttribute('data-check'))openSheet('flip',node.dataset.check);else if(node.hasAttribute('data-visit')){visit.add(node.dataset.visit);toast('임장 코스 카드에 담았습니다');screen='visit';render()}else if(node.hasAttribute('data-compare')){compare.add(node.dataset.compare);toast('비교 카드에 담았습니다');screen='compare';render()}else if(node.hasAttribute('data-toast'))toast(node.dataset.toast);else if(node.hasAttribute('data-close'))close();});
document.addEventListener('click',e=>{if(e.target.id==='sheetOverlay')close()});document.addEventListener('change',e=>{if(e.target.matches('[data-box]')){const i=+e.target.dataset.box;e.target.checked?checked.add(i):checked.delete(i)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('[data-card]'))openSheet('card',e.target.dataset.card)});
render();
</script>
</body></html>
