<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>집감 미리보기 (시제품) | 가보기 전에, 먼저 살펴보세요</title>
<style>
:root{
  --bg:#eff2f5; --surface:#fff; --ink:#15212c; --muted:#46535f; --line:#c9d2db;
  --accent:#17508f; --accent-ink:#fff; --sun:#f5b21a; --shade:#44566a; --warn:#b45309;
  --r:10px; --tap:48px;
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55;overflow-wrap:anywhere;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #0b5fd1;outline-offset:2px}
.band{background:var(--ink);color:#ffd36b;font-weight:800;font-size:19px;line-height:1.4;text-align:center;padding:12px 16px;
  border-bottom:6px solid var(--sun)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:28px;line-height:1.25;margin:4px 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 18px;color:var(--muted);font-size:19px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.lab{display:block;font-weight:800;margin:0 0 8px}
.lab small{font-weight:500;color:var(--muted);font-size:16px}
.chips{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.chips.wide{grid-template-columns:1fr}
.chip{white-space:nowrap;min-height:var(--tap);padding:8px 10px;border:2px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;
  font-weight:700;text-align:center;line-height:1.25;touch-action:manipulation}
.chip small{white-space:normal;display:block;font-weight:500;font-size:15px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:#dbe7f5}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.chip:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.stepbtn{flex:0 0 56px;height:56px;border:2px solid var(--line);border-radius:var(--r);background:#fff;font-size:26px;font-weight:800;cursor:pointer;touch-action:manipulation}
.stepbtn:hover{border-color:var(--accent)}
input[type=range]{flex:1;min-width:0;height:56px;margin:0;accent-color:var(--accent);background:transparent}
.val{font-weight:800}
.hint{color:var(--muted);font-size:16px;margin:6px 0 0}
.result{border:2px solid var(--ink)}
.result .big{font-size:34px;line-height:1.2;font-weight:900;margin:2px 0 2px;letter-spacing:-.01em}
.result .kicker{font-weight:700;margin:0}
.result .warnline{margin:10px 0 0;padding:10px 12px;background:#fff6dc;border-left:6px solid var(--sun);font-size:17px}
ul.plain{margin:6px 0 0;padding-left:1.15em}
ul.plain li{margin:4px 0}
.nowrap{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:16px;color:var(--muted);font-weight:700}
tr.cur td{background:#e8f0fa;font-weight:700}
td small{white-space:nowrap;font-weight:500;color:var(--muted)}
.planbox{padding:12px}
.plan{display:block;width:100%;aspect-ratio:1/1;background:#fafbfc;border:1px solid var(--line);border-radius:var(--r);touch-action:manipulation}
.plan text{font-family:inherit;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.plan text.on{stroke:none}
.state{margin:10px 0 0;padding:10px 12px;border-radius:var(--r);border:2px solid var(--line);font-weight:800;font-size:19px}
.state.sun{background:#fff3cf;border-color:var(--sun)}
.state.shade{background:#e4e9ee;border-color:var(--shade)}
.state.back,.state.night{background:#f4f5f6}
.timebar{position:relative;margin:14px 0 0}
.cells{display:flex;height:48px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;cursor:pointer}
.cell{flex:1 1 0;min-width:0}
.cell.sun{background:var(--sun)}
.cell.shade{background:repeating-linear-gradient(135deg,#44566a 0 4px,#fff 4px 6px)}
.cell.back{background:radial-gradient(circle,#7a8794 1.2px,transparent 1.6px) 0 0/6px 6px,#e6eaee}
.cell.night{background:#f7f8f9}
.marker{position:absolute;top:-6px;bottom:22px;width:0;border-left:3px solid #c1121f;pointer-events:none}
.ticks{position:relative;height:24px;font-size:15px;color:var(--muted)}
.ticks span{position:absolute;top:2px;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 0;padding:0;list-style:none;font-size:16px}
.legend li{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:26px;height:18px;border:1.5px solid var(--ink);border-radius:3px;flex:none}
.sw.sun{background:var(--sun)}
.sw.shade{background:repeating-linear-gradient(135deg,#44566a 0 4px,#fff 4px 6px)}
.sw.back{background:radial-gradient(circle,#7a8794 1.2px,transparent 1.6px) 0 0/6px 6px,#e6eaee}
.sw.night{background:#f7f8f9}
.sw.me{background:var(--accent)}
.sw.front{background:#fbdcb8;border:2.5px solid var(--warn)}
.sw.sh{background:repeating-linear-gradient(135deg,rgba(68,86,106,.75) 0 2px,rgba(68,86,106,.12) 2px 5px);border-style:solid}
.sw.na{background:#e3e5e8;border-style:dashed;border-color:#6d7783}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:var(--tap);border:2px solid var(--line);background:#fff;border-radius:var(--r);font-weight:700;cursor:pointer;touch-action:manipulation;padding:6px 10px}
.btn:hover{border-color:var(--accent)}
.notes li{margin:6px 0}
.notes strong{font-weight:800}
.tag{display:inline-block;padding:0 8px;border-radius:6px;font-size:15px;font-weight:800;border:1.5px solid currentColor;white-space:nowrap}
.tag.hub{color:#0b6b3a}.tag.vworld{color:#6a4a00}.tag.est{color:#9a2a00}.tag.none{color:#46535f}
.field{background:#f3f8ee;border-color:#9bbf86}
.foot{color:var(--muted);font-size:16px}
.loading{padding:30px 16px;text-align:center;font-weight:700}
@media (min-width:980px){
  .layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
  .col-plan{position:sticky;top:12px}
  .plan{aspect-ratio:4/3}
  h1{font-size:34px}
}
@media (min-width:600px) and (max-width:979px){ .plan{aspect-ratio:4/3} .chips{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))} }
@media (prefers-reduced-motion:no-preference){ .chip,.btn,.stepbtn{transition:background-color .12s,border-color .12s,transform .08s} .chip:active,.btn:active,.stepbtn:active{transform:scale(.98)} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="band" role="note">시제품 · 일부 단지 · 참고용 · 정식 서비스 아님</div>
<main class="wrap">
  <h1>집감 미리보기</h1>
  <p class="sub">가보기 전에, 먼저 살펴보세요. 앞 동이 햇빛을 가리는 시간대를 미리 계산해 봅니다.</p>

  <div class="layout">
    <div class="col-ctl">
      <section class="card" aria-labelledby="l-cx">
        <span class="lab" id="l-cx">1. 단지 <small>(시제품은 3곳만 있어요)</small></span>
        <div class="chips wide" id="cx" role="group" aria-labelledby="l-cx"></div>
      </section>
      <section class="card" aria-labelledby="l-dong">
        <span class="lab" id="l-dong">2. 동 <small>(지도에서 눌러도 돼요)</small></span>
        <div class="chips" id="dong" role="group" aria-labelledby="l-dong"></div>
      </section>
      <section class="card" aria-labelledby="l-floor">
        <label class="lab" id="l-floor" for="floor">3. 층 <span class="val" id="floorVal"></span></label>
        <div class="row">
          <button class="stepbtn" id="fdn" type="button" aria-label="한 층 아래로">-</button>
          <input id="floor" type="range" min="1" max="10" step="1" value="1">
          <button class="stepbtn" id="fup" type="button" aria-label="한 층 위로">+</button>
        </div>
        <p class="hint" id="floorHint"></p>
      </section>
      <section class="card" aria-labelledby="l-date">
        <span class="lab" id="l-date">4. 날짜</span>
        <div class="chips" id="date" role="group" aria-labelledby="l-date"></div>
      </section>

      <section class="card result" aria-labelledby="h-res" aria-live="polite" id="result"></section>
      <section class="card" id="cmp" aria-labelledby="h-cmp"></section>
    </div>

    <div class="col-plan">
      <section class="card planbox" aria-labelledby="h-plan">
        <h2 id="h-plan">위에서 본 모습</h2>
        <svg class="plan" id="plan" role="img" aria-labelledby="planTitle planDesc" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="state" id="state"></div>
        <div style="margin-top:12px">
          <label class="lab" for="time">시각 <span class="val" id="timeVal"></span></label>
          <div class="row">
            <button class="stepbtn" id="tdn" type="button" aria-label="15분 전으로">&lt;</button>
            <input id="time" type="range" min="300" max="1185" step="15" value="750">
            <button class="stepbtn" id="tup" type="button" aria-label="15분 뒤로">&gt;</button>
          </div>
        </div>
        <div class="timebar" id="timebar">
          <div class="cells" id="cells"></div><div class="marker" id="marker"></div>
          <div class="ticks" id="ticks" aria-hidden="true"></div>
        </div>
        <ul class="legend" id="legend1"></ul>
        <ul class="legend" id="legend2" style="margin-top:8px"></ul>
        <div class="btnrow"><button class="btn" id="zoom" type="button" aria-pressed="false">넓게 보기</button></div>
      </section>
    </div>
  </div>

  <section class="card field" aria-labelledby="h-field" id="field"></section>
  <section class="card" aria-labelledby="h-ev" id="evidence"></section>
  <p class="foot" id="foot"></p>
</main>

<script src="../../static/shadow.js"></script>
<script src="calc.js"></script>
<script>
(function () {
'use strict';
const S = window.DJShadow, C = window.PVCalc;
const COMPLEXES = [
  { id: '30200-631', short: '트리풀시티 5단지', where: '대전 유성구 상대동' },
  { id: '36110-203', short: '첫마을 5단지', where: '세종 한솔동' },
  { id: '36110-421', short: '나릿재마을 2단지', where: '세종 나성동' },
];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = C.kstToday();
const DATES = [
  { key: 'dec', name: '동지', date: { year: today.year, month: 12, day: 21 } },
  { key: 'jun', name: '하지', date: { year: today.year, month: 6, day: 21 } },
  { key: 'today', name: '오늘', date: today },
];
const dtxt = d => d.month + '월 ' + d.day + '일';
const NO_LABEL = { sun: '직사광이 닿을 가능성이 있음', shade: '앞 동에 가려짐', back: '해가 이 면의 반대쪽에 있어 닿지 않음', night: '해가 지평선 근처이거나 아래에 있음' };

const st = { cid: COMPLEXES[0].id, tid: null, fl: 1, dk: 'dec', t: 750, wide: false };
const cache = {};          // 단지 자료
let ctx = null, sums = null, slots = null, view = null;

// ---------- 자료 읽기 (file:// 에서도 되도록 <script> 로 읽음) ----------
function loadComplex(id) {
  return new Promise((res, rej) => {
    if (cache[id]) return res(cache[id]);
    window.PV_DATA = window.PV_DATA || {};
    const sc = document.createElement('script');
    sc.src = 'data/' + id + '.js';
    sc.onload = () => { if (!window.PV_DATA[id]) return rej(new Error('자료 형식')); cache[id] = C.prepare(window.PV_DATA[id]); res(cache[id]); };
    sc.onerror = () => rej(new Error('자료 파일'));
    document.head.appendChild(sc);
  });
}

// ---------- 계산 ----------
function curDate() { return DATES.find(d => d.key === st.dk).date; }
function recompute() {
  sums = {}; slots = {};
  for (const d of DATES) { const s = C.run(ctx, st.tid, st.fl, d.date); slots[d.key] = s; sums[d.key] = C.summarize(ctx, s); }
}
function tgt() { return ctx.byId[st.tid]; }
function ownDongs() { return ctx.items.filter(b => b.k === 'own' && C.calcable(b)).sort((a, b) => (+C.dongNo(a.dn)) - (+C.dongNo(b.dn))); }

function pickDefault() {
  const own = ownDongs(); let best = null;
  for (const b of own) {
    const fl = Math.max(1, Math.round(b.f / 3));
    const sm = C.summarize(ctx, C.run(ctx, b.id, fl, DATES[0].date));
    if (sm.shadeMin > 0 && (!best || sm.shadeMin > best.s)) best = { b, fl, s: sm.shadeMin };
  }
  return best ? { tid: best.b.id, fl: best.fl } : { tid: own[0].id, fl: Math.max(1, Math.round(own[0].f / 3)) };
}

// ---------- 컨트롤 그리기 ----------
function chipHTML(label, pressed, extra, data) {
  return '<button type="button" class="chip" aria-pressed="' + pressed + '" ' + data + '>' + esc(label) + (extra ? '<small>' + esc(extra) + '</small>' : '') + '</button>';
}
function drawControls() {
  $('cx').innerHTML = COMPLEXES.map(c => chipHTML(c.short, c.id === st.cid, c.where, 'data-cx="' + c.id + '"')).join('');
  $('dong').innerHTML = ownDongs().map(b => chipHTML(C.dongNo(b.dn) + '동', b.id === st.tid, '', 'data-dong="' + b.id + '" aria-label="' + C.dongNo(b.dn) + '동, ' + b.f + '층 건물"')).join('');
  $('date').innerHTML = DATES.map(d => chipHTML(d.name, d.key === st.dk, dtxt(d.date), 'data-date="' + d.key + '"')).join('');
  drawFloor();
}
function drawFloor() {
  const b = tgt(), el = $('floor');
  el.max = b.f; el.min = 1; el.value = st.fl;
  const fh = C.baseFh(ctx, b), z = (st.fl - 0.5) * fh;
  $('floorVal').textContent = ': ' + st.fl + '층 (지상 약 ' + z.toFixed(1) + ' m)';
  el.setAttribute('aria-valuetext', st.fl + '층, 지상 약 ' + z.toFixed(0) + '미터');
  $('floorHint').textContent = C.label(b) + '은 지상 ' + b.f + '층 건물이에요. 한 층 높이는 약 ' + fh.toFixed(2) + ' m로 계산했어요.';
}

// ---------- 결과 ----------
function rangeTxt(r) { return C.minToHM(r.start) + ' ~ ' + C.minToHM(r.end); }
function blockersTxt(sm) {
  return sm.blockers.length ? sm.blockers.map(b => b.label + ' (약 ' + C.durText(b.min) + ')').join(', ') : '';
}
function drawResult() {
  const sm = sums[st.dk], d = DATES.find(x => x.key === st.dk), b = tgt();
  const head = C.label(b) + ' ' + st.fl + '층 · ' + d.name + ' (' + dtxt(d.date) + ')';
  let h = '<h2 id="h-res">' + esc(head) + '</h2>';
  h += '<p class="kicker">이 조건에서 직사광이 닿을 가능성이 있는 시간대</p>';
  h += '<p class="big">약 ' + C.durText(sm.sunMin) + ' <span style="font-size:20px;font-weight:700">(추정)</span></p>';
  if (sm.sunRanges.length) h += '<p style="margin:2px 0 0">' + sm.sunRanges.map(r => '<span class="nowrap">' + rangeTxt(r) + '</span>').join(', ') + '</p>';
  else h += '<p style="margin:2px 0 0">이 조건에서는 직사광이 닿는 시간대가 계산되지 않았어요.</p>';
  h += '<ul class="plain">';
  h += sm.shadeMin ? '<li><strong>앞 동에 가려지는 시간</strong> 약 ' + C.durText(sm.shadeMin) + (sm.shadeRanges.length ? ' (' + sm.shadeRanges.map(rangeTxt).join(', ') + ')' : '') + '</li>'
                   : '<li><strong>앞 동에 가려지는 시간</strong>은 이 조건에서 계산되지 않았어요.</li>';
  if (sm.blockers.length) h += '<li><strong>가리는 동</strong>: ' + sm.blockers.map(x => esc(x.label) + ' (약 ' + C.durText(x.min) + ', ' + C.SRC_LABEL[x.src] + ')').join(', ') + '</li>';
  if (sm.backMin) h += '<li>해가 이 동 남쪽 면의 반대쪽에 있어 닿지 않는 시간 약 ' + C.durText(sm.backMin) + '</li>';
  h += '</ul>';
  h += '<p class="warnline">실내 채광이나 법적 일조권을 뜻하지 않는 참고용 추정이에요. 지형·나무·창 방향은 반영하지 않았어요.</p>';
  $('result').innerHTML = h;

  const rows = DATES.map(x => {
    const s = sums[x.key];
    return '<tr' + (x.key === st.dk ? ' class="cur" aria-current="true"' : '') + '><td>' + x.name + '<br><small>' + dtxt(x.date) + '</small></td><td>약 ' + C.durText(s.sunMin) + '</td><td>' +
      (s.blockers.length ? s.blockers.slice(0, 3).map(y => esc(y.label)).join(', ') + (s.blockers.length > 3 ? ' 외 ' + (s.blockers.length - 3) + '동' : '') : '없음') + '</td></tr>';
  }).join('');
  $('cmp').innerHTML = '<h2 id="h-cmp">날짜별로 견주기</h2><table><thead><tr><th scope="col">날짜</th><th scope="col">직사광 가능 시간(추정)</th><th scope="col">가리는 동</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="hint">같은 동·같은 층으로 계산한 값이에요. 15분 칸으로 세어서 15분 단위로만 나와요.</p>';
}

// ---------- 시간대 막대 ----------
function drawBar() {
  const sl = slots[st.dk], sm = sums[st.dk];
  $('cells').innerHTML = sl.map(s => '<span class="cell ' + s.state + '"></span>').join('');
  const n = sl.length;
  $('ticks').innerHTML = [6, 9, 12, 15, 18].map(h => '<span style="left:' + ((h * 60 - C.START) / (C.END - C.START) * 100) + '%">' + h + '시</span>').join('');
  $('legend1').innerHTML = '<li><span class="sw sun"></span>직사광 가능</li><li><span class="sw shade"></span>앞 동에 가림</li><li><span class="sw back"></span>해가 벽 반대편</li><li><span class="sw night"></span>해가 없음</li>';
  const parts = ['시간대 막대 ' + C.minToHM(C.START) + '부터 ' + C.minToHM(C.END) + '까지, 15분 간격.'];
  parts.push('직사광 가능 ' + (sm.sunRanges.length ? sm.sunRanges.map(rangeTxt).join(', ') : '없음') + '.');
  parts.push('앞 동에 가림 ' + (sm.shadeRanges.length ? sm.shadeRanges.map(rangeTxt).join(', ') : '없음') + '.');
  $('cells').setAttribute('role', 'img'); $('cells').setAttribute('aria-label', parts.join(' '));
  drawMarker();
}
function drawMarker() {
  const pos = (st.t - C.START + 7.5) / (C.END - C.START) * 100;
  $('marker').style.left = pos + '%';
}

// ---------- 평면도 ----------
const NS = 'http://www.w3.org/2000/svg';
function polyPts(p) { return p.map(q => q[0].toFixed(1) + ',' + (-q[1]).toFixed(1)).join(' '); }
function centroid(p) { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; }
function computeView(svg) {
  const sm = sums[st.dk]; let pts = [];
  const add = b => { for (const q of b.rect === b.poly ? b.poly : b.poly) pts.push(q); };
  if (st.wide) { const R = 255; pts = [[-R, -R], [R, R]]; }
  else {
    for (const q of tgt().rect) pts.push(q);
    for (const bl of sm.blockers.slice(0, 3)) add(ctx.byId[bl.id]);
    if (pts.length < 6) pts.push([-40, -40], [40, 40]);
  }
  let x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0])), y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));

  if (DATES.some(d => d.key === p.get('date'))) st.dk = p.get('date');
  const t = +p.get('t'); if (t >= 300 && t <= 1185) st.t = Math.round(t / 15) * 15;
  st.wide = p.get('wide') === '1';
  st._dong = p.get('d'); st._fl = +p.get('f') || 0;
}

document.addEventListener('click', ev => {
  const bt = ev.target.closest('button'); if (!bt || !ctx) return;
  if (bt.dataset.cx) { if (bt.dataset.cx !== st.cid) { st.tid = null; chooseComplex(bt.dataset.cx); } }
  else if (bt.dataset.dong) select(bt.dataset.dong);
  else if (bt.dataset.date) { st.dk = bt.dataset.date; fullRender(); writeHash(); }
  else if (bt.id === 'fdn' || bt.id === 'fup') { st.fl = Math.min(tgt().f, Math.max(1, st.fl + (bt.id === 'fup' ? 1 : -1))); fullRender(); writeHash(); }
  else if (bt.id === 'tdn' || bt.id === 'tup') { st.t = Math.min(1185, Math.max(300, st.t + (bt.id === 'tup' ? 15 : -15))); $('time').value = st.t; tick(); }
  else if (bt.id === 'zoom') { st.wide = !st.wide; bt.setAttribute('aria-pressed', st.wide); bt.textContent = st.wide ? '가까이 보기' : '넓게 보기'; drawPlan(); writeHash(); }
});
$('floor').addEventListener('input', e => { st.fl = +e.target.value; fullRender(); writeHash(); });
$('time').addEventListener('input', e => { st.t = +e.target.value; tick(); });
$('cells').addEventListener('click', e => {
  const r = $('cells').getBoundingClientRect(), i = Math.min(slots[st.dk].length - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * slots[st.dk].length)));
  st.t = C.START + i * C.STEP; $('time').value = st.t; tick();
});
function tick() { drawMarker(); drawPlan(); writeHash(); }
let rz = 0; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (ctx) drawPlan(); }); });

readHash();
$('zoom').setAttribute('aria-pressed', st.wide); if (st.wide) $('zoom').textContent = '가까이 보기';
$('time').value = st.t;
chooseComplex(st.cid).then(() => {
  if (st._dong) { const b = ownDongs().find(x => C.dongNo(x.dn) === st._dong); if (b) { st.tid = b.id; if (st._fl) st.fl = Math.min(b.f, st._fl); fullRender(); } }
});
})();
</script>
</body>
</html>
