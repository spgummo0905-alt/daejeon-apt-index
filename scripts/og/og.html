<!doctype html>
<!-- 링크 미리보기 이미지 원본. ?r=대전|세종|서울|청주 로 열어 1200×630 으로 찍습니다 (scripts/og/make.mjs). -->
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face { font-family: P; src: url("PretendardVariable.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { font-family: P, sans-serif; color: #fff; letter-spacing: -0.02em;
  background: radial-gradient(900px 520px at 78% 40%, #1e3a6e 0%, rgba(30,58,110,0) 70%),
              radial-gradient(700px 500px at 0% 100%, #142a52 0%, rgba(20,42,82,0) 70%),
              linear-gradient(160deg, #0a1428 0%, #0d1b36 55%, #0a1326 100%); position: relative; }
.grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px); background-size: 22px 22px;
  mask-image: linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.15) 60%); }
.sky { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; opacity: .55; }
.left { position: absolute; left: 72px; top: 64px; width: 600px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: rgba(255,255,255,.86); }
.brand .word { font-size: 34px; font-weight: 900; letter-spacing: -0.06em; color: #fff; line-height: 1; }
.brand .sym { width: 46px; height: 46px; object-fit: contain; margin-right: -4px; }
.brand .word b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #a28cff; margin-left: 3px; }
.brand #brand { font-size: 16px; font-weight: 800; padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.9); }
.brand em { font-style: normal; color: rgba(255,255,255,.5); font-weight: 600; font-size: 18px; margin-left: 4px; }
h1 { margin-top: 34px; font-size: 80px; line-height: 1.12; font-weight: 850; letter-spacing: -0.045em; }
h1 .gold { background: linear-gradient(100deg, #fff1c1 0%, #e8bf5a 40%, #fff6d8 55%, #d9a63a 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin-top: 22px; font-size: 27px; line-height: 1.5; color: rgba(255,255,255,.72); font-weight: 500; }
.sub b { color: #fff; font-weight: 700; }
.grades { position: absolute; left: 72px; bottom: 62px; display: flex; align-items: center; gap: 10px; }
.g { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-weight: 900; font-size: 22px; }
.g.s { color: #2a1c02; background: linear-gradient(135deg, #fff0b8, #d9a63a 55%, #f6d47c); box-shadow: 0 6px 18px rgba(232,191,90,.45); }
.g.a { color: #1d2430; background: linear-gradient(135deg, #f4f6f9, #aab3bf 60%, #e4e8ee); }
.g.b { color: #fff; background: linear-gradient(135deg, #5d9cf0, #2a62c4); }
.g.c { color: #fff; background: #4a5568; }
.g.d { color: #c8ced8; background: #2c3442; }
.grades span { margin-left: 10px; font-size: 21px; color: rgba(255,255,255,.62); font-weight: 600; }
/* 카드 */
.deck { position: absolute; right: 78px; top: 50%; width: 390px; height: 510px; transform: translateY(-50%); }
.card { position: absolute; inset: 0; border-radius: 30px; padding: 12px; }
.card .in { position: relative; height: 100%; border-radius: 21px; overflow: hidden; }
.back { transform: rotate(-11deg) translate(-78px, 14px); background: linear-gradient(135deg, #c7ced8, #8e98a6 50%, #dfe4ea); box-shadow: 0 30px 60px rgba(0,0,0,.45); }
.back .in { background: #142445; display: grid; place-items: center;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px), repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px); }
.back .in b { font-size: 120px; font-weight: 900; color: rgba(255,255,255,.12); }
.mid { transform: rotate(8deg) translate(70px, 6px); background: linear-gradient(135deg, #f4f6f9, #aab3bf 50%, #e9edf2); box-shadow: 0 30px 60px rgba(0,0,0,.45); }
.mid .in { background: linear-gradient(180deg, #1b2c4f, #111d36); }
.front { background: linear-gradient(135deg, #fff1c1 0%, #d4a640 30%, #fff3cf 52%, #b8862a 75%, #f2d07a 100%);
  box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 60px rgba(232,191,90,.25); }
.front .in { background: radial-gradient(420px 300px at 30% 0%, #24406f 0%, #13223f 60%, #0e1a33 100%); padding: 26px 26px 22px; }
.holo { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.16) 42%, rgba(160,220,255,.12) 47%, rgba(255,210,240,.12) 52%, transparent 62%); pointer-events: none; }
.top { display: flex; align-items: center; gap: 14px; }
.coin { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 30px; color: #3a2702;
  background: radial-gradient(circle at 35% 30%, #fff4cc, #e2b34e 55%, #a97a1c); box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 6px 16px rgba(0,0,0,.4); }
.nm { flex: 1; }
.nm b { display: block; height: 20px; width: 170px; border-radius: 6px; background: rgba(255,255,255,.22); filter: blur(1.2px); }
.nm small { display: block; margin-top: 9px; font-size: 16px; color: rgba(255,255,255,.55); font-weight: 600; }
.score { text-align: right; }
.score small { display: block; font-size: 13px; color: rgba(255,255,255,.55); font-weight: 600; }
.score strong { font-size: 54px; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #fff3cf, #e1b04a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.art { margin-top: 18px; height: 150px; border-radius: 16px; border: 2px solid rgba(232,191,90,.7); position: relative; overflow: hidden;
  background: linear-gradient(180deg, #1d3a6c 0%, #2b4f86 55%, #f0c46a 140%); }
.art svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
.ask { position: absolute; inset: 0; display: grid; place-items: center; }
.ask span { padding: 9px 18px; border-radius: 999px; background: rgba(10,20,40,.66); border: 1px solid rgba(255,255,255,.25); font-size: 19px; font-weight: 800; color: #fff3cf;
  backdrop-filter: blur(2px); }
.bars { margin-top: 20px; display: grid; gap: 13px; }
.bar { display: grid; grid-template-columns: 60px 1fr 34px; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: rgba(255,255,255,.82); }
.bar i { height: 9px; border-radius: 999px; background: rgba(255,255,255,.1); position: relative; overflow: hidden; }
.bar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, #b8862a, #f6d987); }
.bar em { font-style: normal; text-align: right; color: rgba(255,255,255,.4); filter: blur(2.5px); font-weight: 900; }
.foot { position: absolute; left: 26px; right: 26px; bottom: 20px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: rgba(255,255,255,.5); }
.foot b { color: #e8bf5a; letter-spacing: 2px; }
.spark { position: absolute; color: #ffe9a8; text-shadow: 0 0 12px rgba(255,220,130,.9); }
</style></head>
<body>

    <rect x="252" y="96" width="5" height="6"/><rect x="404" y="86" width="5" height="6"/><rect x="420" y="110" width="5" height="6"/><rect x="612" y="98" width="5" height="6"/>

<div class="left">

</div>

</body></html>
