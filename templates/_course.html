{# 임장 코스: 관심 단지를 가까운 순서로 묶어 하루 동선, 구간마다 카카오맵 길찾기, 단지마다 현장 체크리스트 (course.js) #}
<section class="panel course" id="course" aria-labelledby="course-title">
  <div class="panel-head">
    <h2 id="course-title">임장 코스</h2>
    <p class="muted">방문할 단지를 모아 임장 동선을 계획해 보세요. 가장 짧은 순서로 잇고, 구간마다 카카오맵 길찾기와 현장 체크리스트를 함께 보여 줍니다.</p>
  </div>
  <div class="cs-ctl">
    <div class="cs-add"><input type="search" placeholder="코스에 단지 더하기 (단지·동 이름)" aria-label="코스에 단지 더하기" data-cs-add></div>
    <div class="seg" role="group" aria-label="이동 수단">
      <button type="button" class="seg-btn active" data-cs-mode="walk" aria-pressed="true">걸어서</button>
      <button type="button" class="seg-btn" data-cs-mode="car" aria-pressed="false">차로</button>
    </div>
  </div>
  <p class="muted cs-empty" data-cs-empty hidden>아직 코스가 없습니다. 관심 단지를 두 곳 이상 저장하거나 위 검색창에서 단지를 추가하면 코스가 만들어집니다.</p>
  <div class="cs-body" data-cs-body hidden>
    <div class="cs-sum" data-cs-sum></div>
    <div class="cs-grid">
      <figure class="cs-map" data-cs-map></figure>
      <ol class="cs-list" data-cs-list></ol>
    </div>
    <div class="cs-actions">
      <button type="button" class="btn" data-cs-share><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span>코스 공유</span></button>
      <button type="button" class="btn ghost" data-cs-print>인쇄·PDF로 저장</button>
    </div>
  </div>
</section>
