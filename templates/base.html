<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ region }} 아파트 지수{% endblock %}</title>
<meta name="description" content="{% block description %}{{ region }} 아파트를 실거래가, 입지점수, 실질수익률로 비교합니다.{% endblock %}">
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
{% if demo %}
<div class="demo-banner">데모 화면입니다. 아래 숫자는 무작위로 만든 가짜 데이터이며 실제 단지와 무관합니다.</div>
{% endif %}
<header class="site">
  <a class="brand" href="{{ root }}index.html">{{ region }} 아파트 지수</a>
  <nav><a href="{{ root }}index.html">단지 목록</a><a href="{{ root }}methodology.html">산출 방법</a></nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer>
  국토교통부 아파트 매매 실거래가 기준 ({{ meta.asof }}) · 위치 정보 카카오 로컬 ·
  지수와 점수는 참고용이며 투자 권유가 아닙니다.
</footer>
<script src="{{ root }}static/charts.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
